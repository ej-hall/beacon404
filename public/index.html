<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020504">
    <title>BEACON 404.online</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <div class="intro-screen" id="introScreen" aria-label="BEACON404 loading">
      <div class="intro-screen__frame">
        <div class="intro-screen__title">BEACON 404.online</div>
        <div class="intro-screen__status">signal acquiring</div>
      </div>
    </div>

    <div class="video-stage" id="videoStage">
      <video class="video-stage__media" id="backgroundVideo" playsinline muted preload="auto"></video>
      <div class="video-stage__overlay video-stage__overlay--grain"></div>
      <div class="video-stage__overlay video-stage__overlay--future" id="videoOverlayLayer"></div>
      <div class="video-telemetry">
        <div class="video-telemetry__stream" id="videoTelemetry"></div>
        <button class="video-telemetry__button" id="transcribeAudio" type="button">transcribe audio</button>
        <div class="video-telemetry__transcript" id="videoTranscript" hidden></div>
      </div>
      <div class="video-stage__wash"></div>
    </div>

    <div class="video-controls" id="videoControls" aria-label="Video controls">
      <button class="video-controls__button" id="videoRewind" type="button">rewind</button>
    </div>

    <main class="terminal-shell" aria-label="BEACON404 terminal interface">
      <section class="terminal" id="terminal">
        <div class="terminal__header">
          <button class="terminal__light terminal__light--red" id="terminalToggle" type="button" aria-label="Collapse terminal"></button>
          <button class="admin-override" id="adminOverrideButton" type="button" hidden>admin override</button>
          <span class="terminal__title">BEACON 404.online</span>
        </div>

        <div class="terminal__screen" id="screen" role="log" aria-live="polite" aria-atomic="false"></div>

        <form class="terminal__form" id="commandForm" autocomplete="off">
          <label class="sr-only" for="commandInput">Terminal command</label>
          <span class="prompt" id="promptLabel">unknown@beacon404:</span>
          <input
            id="commandInput"
            class="terminal__input"
            name="command"
            type="text"
            spellcheck="false"
            autocapitalize="none"
            autocomplete="off"
            inputmode="text"
            aria-describedby="promptLabel"
            autofocus
          >
          <span class="prompt-ghost" id="promptGhost" aria-hidden="true"></span>
          <span class="cursor" aria-hidden="true"></span>
        </form>
      </section>
    </main>

    <div class="modal-backdrop" id="adminModal" hidden>
      <section class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
        <button class="admin-modal__close" id="adminModalClose" type="button" aria-label="Close admin override">x</button>
        <h2 id="adminModalTitle">ADMIN OVERRIDE</h2>
        <p>authority chain unavailable</p>
        <label for="adminPin">4-number PIN</label>
        <input id="adminPin" class="admin-modal__pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <button class="admin-modal__submit" id="adminPinSubmit" type="button">submit</button>
        <div class="admin-modal__result" id="adminModalResult" aria-live="polite"></div>
      </section>
    </div>

    <script src="/js/background-video.js" defer></script>
    <script src="/js/terminal.js" defer></script>
  </body>
</html>
